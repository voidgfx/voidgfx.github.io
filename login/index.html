<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود — VOID GFX</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="nav-inner">
            <a href="index.html" class="brand">
                <span class="brand-symbol">V</span>
                <span>VOID<span class="purple">GFX</span></span>
            </a>
            <div class="nav-actions">
                <a href="signup.html" class="btn btn-ghost">ثبت‌نام</a>
            </div>
        </div>
    </header>

    <div class="form-container">
        <h2>خوش برگشتی 👋</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">ایمیل</label>
                <input type="email" id="email" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label for="password">رمز عبور</label>
                <input type="password" id="password" placeholder="رمز عبورت" required>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary btn-large" id="loginBtn">ورود</button>
            </div>
            <p class="form-message" id="message"></p>
        </form>
        <p class="form-switch">
            حساب نداری؟ <a href="signup.html">ثبت‌نام کن</a>
        </p>
    </div>

    <script type="module">
        import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

        const SUPABASE_URL = "https://bqclfxdhxvswgmvdvtok.supabase.co";
        const SUPABASE_KEY = "اینجا کلید Publishable خودت رو بذار";
        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        const form = document.getElementById('loginForm');
        const message = document.getElementById('message');
        const btn = document.getElementById('loginBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            btn.disabled = true;
            btn.textContent = 'در حال ورود...';
            message.textContent = '';

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { error } = await supabase.auth.signInWithPassword({ email, password });

            if (error) {
                message.textContent = 'ایمیل یا رمز عبور اشتباه است.';
                message.className = 'form-message error';
                btn.disabled = false;
                btn.textContent = 'ورود';
            } else {
                message.textContent = 'با موفقیت وارد شدی! در حال انتقال...';
                message.className = 'form-message success';
                setTimeout(() => window.location.href = 'index.html', 800);
            }
        });
    </script>

</body>
</html>
