<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت‌نام — VOID GFX</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="nav-inner">
            <a href="index.html" class="brand">
                <span class="brand-symbol">V</span>
                <span>VOID<span class="purple">GFX</span></span>
            </a>
            <div class="nav-actions">
                <a href="login.html" class="btn btn-ghost">ورود</a>
            </div>
        </div>
    </header>

    <div class="form-container">
        <h2>ساخت حساب جدید ✨</h2>
        <form id="signupForm">
            <div class="form-group">
                <label for="username">نام کاربری</label>
                <input type="text" id="username" placeholder="مثلاً taha" minlength="3" required>
            </div>
            <div class="form-group">
                <label for="email">ایمیل</label>
                <input type="email" id="email" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label for="password">رمز عبور</label>
                <input type="password" id="password" placeholder="حداقل ۶ کاراکتر" minlength="6" required>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary btn-large" id="signupBtn">ثبت‌نام</button>
            </div>
            <p class="form-message" id="message"></p>
        </form>
        <p class="form-switch">
            حساب داری؟ <a href="login.html">وارد شو</a>
        </p>
    </div>

    <script type="module">
        import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

        const SUPABASE_URL = "https://bqclfxdhxvswgmvdvtok.supabase.co";
        const SUPABASE_KEY = "اینجا کلید Publishable خودت رو بذار";
        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        const form = document.getElementById('signupForm');
        const message = document.getElementById('message');
        const btn = document.getElementById('signupBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            btn.disabled = true;
            btn.textContent = 'در حال ساخت...';
            message.textContent = '';

            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { data, error } = await supabase.auth.signUp({
                email,
                password,
                options: { data: { username } }
            });

            if (error) {
                message.textContent = error.message;
                message.className = 'form-message error';
                btn.disabled = false;
                btn.textContent = 'ثبت‌نام';
            } else if (data.user && !data.session) {
                message.textContent = 'حساب ساخته شد. ایمیلت رو برای تأیید بررسی کن.';
                message.className = 'form-message success';
            } else {
                message.textContent = 'حساب ساخته شد! در حال انتقال...';
                message.className = 'form-message success';
                setTimeout(() => window.location.href = 'index.html', 800);
            }
        });
    </script>

</body>
</html>
