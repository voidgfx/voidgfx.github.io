<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پروفایل — VOID GFX</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="nav-inner">
            <a href="index.html" class="brand">
                <span class="brand-symbol">V</span>
                <span>VOID<span class="purple">GFX</span></span>
            </a>
            <nav class="nav-links">
                <a href="index.html">گالری</a>
                <a href="upload.html">آپلود</a>
            </nav>
            <div class="nav-actions">
                <button id="logoutBtn" class="btn btn-ghost">خروج</button>
            </div>
        </div>
    </header>

    <main style="max-width: 900px; margin: 40px auto; padding: 0 20px;">
        <div style="background: var(--surface-2); border-radius: var(--radius); padding: 30px; border: 1px solid var(--border); margin-bottom: 30px;">
            <h1 id="welcomeText">خوش آمدی!</h1>
            <p id="userEmail" style="color: var(--text-dim);"></p>
        </div>

        <h2 style="margin-bottom: 20px;">فایل‌های من</h2>
        <div class="gfx-grid" id="myAssets">
            <p style="color: var(--text-dim); grid-column: 1/-1;">در حال بارگذاری...</p>
        </div>
    </main>

    <footer>
        <div class="footer-inner">
            <p>© ۲۰۲۶ VOID GFX</p>
        </div>
    </footer>

    <script type="module">
        import { supabase } from './config.js';

        const { data: { user } } = await supabase.auth.getUser();
        if (!user) {
            window.location.href = 'auth.html';
        }

        document.getElementById('welcomeText').textContent = `خوش آمدی، ${user.user_metadata?.username || 'کاربر'}!`;
        document.getElementById('userEmail').textContent = user.email;

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await supabase.auth.signOut();
            window.location.href = 'index.html';
        });

        async function loadMyAssets() {
            const grid = document.getElementById('myAssets');
            const { data, error } = await supabase
                .from('assets')
                .select('*')
                .eq('user_id', user.id)
                .order('created_at', { ascending: false });

            if (error || !data || data.length === 0) {
                grid.innerHTML = '<p style="color: var(--text-dim); grid-column: 1/-1;">هنوز فایلی آپلود نکردی.</p>';
                return;
            }

            grid.innerHTML = data.map(item => `
                <div class="gfx-card" onclick="window.location.href='asset.html?id=${item.id}'">
                    <div class="gfx-preview">
                        <img src="${item.preview_url || 'https://via.placeholder.com/400x300/1a1a2e/8b5cf6?text=No+Preview'}" alt="${item.title}">
                    </div>
                    <div class="gfx-info">
                        <span class="gfx-category">${item.category}</span>
                        <h3 class="gfx-title">${item.title}</h3>
                        <div class="gfx-meta">
                            <span>♥ ${item.likes || 0}</span>
                            <span>↓ ${item.downloads || 0}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        loadMyAssets();
    </script>
</body>
</html>
