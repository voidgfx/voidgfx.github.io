<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشاهده جزوه | آکادمی دانش</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* =====================================
           استایل‌های کادرهای تزئینی (طراحی خودت)
        ===================================== */
        :root { --gold: #c49a50; --gold-light: #e8cf94; --navy: #172b4d; --wine: #803b4a; --cream: #fff7e5; --brown: #76552f; }
        
        body { font-family: 'Vazirmatn', sans-serif; background: #f4f4f4; padding: 20px; line-height: 2.2; color: #333; display: flex; flex-direction: column; min-height: 100vh; }
        .container { max-width: 800px; margin: 0 auto; width: 100%; flex: 1; }

        .trad-box { position: relative; padding: 24px; margin: 22px 0; border-radius: 12px; overflow: hidden; transition: .3s ease; }
        .trad-box:hover { transform: translateY(-3px); }

        .royal-box { color: #fff; background: linear-gradient(135deg,#172b4d,#263d65); border: 2px solid var(--gold); outline: 1px solid #c49a50; outline-offset: 4px; box-shadow: 0 8px 25px #172b4d25; }
        .royal-box::before, .royal-box::after { content: "❧"; position: absolute; color: var(--gold-light); font-size: 32px; }
        .royal-box::before { top: 5px; right: 12px; } .royal-box::after { bottom: 5px; left: 12px; }

        .parchment-box { color: #60482b; background: linear-gradient(135deg,#fff9e9,#f0dfbd); border: 2px solid #b18a4c; box-shadow: inset 0 0 20px #b18a4c25, 0 5px 18px #00000012; }
        .parchment-box::before { content: "❧  ✦  ❧"; display: block; text-align: center; color: #a77b43; font-size: 23px; margin-bottom: 8px; }

        .wine-box { background: linear-gradient(145deg,#843b4a,#612a3a); color: #fff3dc; border: 3px double #e0b86e; border-radius: 18px; box-shadow: 0 7px 20px #6d26352b; }
        .wine-box::before { content: "✧ ❀ ✧"; display: block; color: #f0d18e; text-align: center; font-size: 23px; }

        .definition-box { background: #edf3e7; color: #38543a; border: 2px solid #82966a; border-right: 6px solid #607b4c; border-radius: 10px 18px 18px 10px; }
        .definition-box::before { content: "۞ تعریف ۞"; display: block; font-weight: bold; color: #4e7042; margin-bottom: 8px; }

        .tip-box { background: #fff5d9; color: #70501d; border: 2px solid #d2ad62; border-radius: 14px; }
        .tip-box::before { content: "❀ نکته طلایی ❀"; display: block; color: #a07830; font-weight: bold; margin-bottom: 8px; }

        .warning-box { background: #fae9e8; color: #753c40; border: 2px solid #c47a7a; border-right: 6px solid #a64d56; border-radius: 12px; }
        .warning-box::before { content: "✧ توجه مهم ✧"; display: block; font-weight: bold; color: #a33f4c; margin-bottom: 8px; }

        .example-box { background: #f5eddf; color: #654b2c; border: 2px dashed #b58b52; border-radius: 8px; }
        .example-box::before { content: "❦ مثال آموزشی ❦"; display: block; font-weight: bold; color: #91652e; margin-bottom: 8px; }

        .formula-box { background: #f1eafa; color: #634486; border: 2px solid #a68ac3; border-radius: 16px; text-align: center; font-size: 20px; }

        .result-box { background: #eaf2e5; color: #42623c; border: 2px solid #8da47b; border-radius: 14px; box-shadow: inset 0 0 15px #7d9c6620; }
        .result-box::before { content: "❧ نتیجه‌گیری ❧"; display: block; font-weight: bold; color: #537347; margin-bottom: 8px; }

        .quote-box { background: #f8f0e1; color: #735b3b; border: 1px solid #c6a36c; border-right: 5px solid #b28a4d; border-radius: 10px; font-style: italic; }

        .question-box { background: #eaf0f8; color: #304c70; border: 2px solid #829bbd; border-radius: 14px; }
        .question-box::before { content: "✦ پرسش ✦"; display: block; color: #3d618d; font-weight: bold; margin-bottom: 8px; }

        .answer-box { background: #e9f4e9; color: #365c3c; border: 2px solid #86a889; border-radius: 14px; }
        .answer-box::before { content: "✧ پاسخ ✧"; display: block; color: #47734e; font-weight: bold; margin-bottom: 8px; }

        .chapter-box { background: linear-gradient(135deg,#193653,#294e69); color: #fff3d3; text-align: center; border: 3px double #d6b66d; border-radius: 5px; padding: 30px 18px; box-shadow: 0 6px 20px #142d4530; }
        .chapter-box::before, .chapter-box::after { content: "❧ ✦ ❧"; display: block; color: #e5c67d; font-size: 22px; }

        .chapter-tag { display: inline-block; padding: 5px 20px; color: #fff0c8; background: #243b5d; border: 1px solid #c49a50; border-radius: 30px; font-size: 14px; }
        
        /* استایل هدر و دکمه بازگشت */
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid var(--gold); padding-bottom: 15px; }
        .logo-text { font-size: 20px; font-weight: 900; color: var(--navy); display: flex; align-items: center; gap: 8px; }
        .logo-text i { color: var(--gold); }
        .btn-back { text-decoration: none; background: var(--navy); color: #fff; padding: 8px 20px; border-radius: 50px; font-size: 14px; transition: 0.3s; display: flex; align-items: center; gap: 5px;}
        .btn-back:hover { background: var(--wine); }

        @media (max-width: 600px) { .trad-box { padding: 18px; margin: 17px 0; font-size: 14px; } .formula-box { font-size: 17px; } }
    </style>
</head>
<body>

    <div class="container">
        <!-- هدر صفحه -->
        <div class="header-bar">
            <div class="logo-text"><i class="fa-solid fa-graduation-cap"></i> آکادمی دانش</div>
            <a href="index.html" class="btn-back"><i class="fa-solid fa-arrow-right"></i> بازگشت به لیست</a>
        </div>

        <!-- محتوای جزوه (داینامیک) -->
        <div id="content-area">
            <p style="text-align:center;">در حال دریافت اطلاعات جزوه...</p>
        </div>
    </div>

<script>
    const supabaseUrl = 'https://quvmycjmphfufodygrfe.supabase.co'; 
    const supabaseKey = 'sb_publishable_yJMUW7s7PGzq1bILJwFbKw_HM0FE57D'; 
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    async function loadJozve() {
        const urlParams = new URLSearchParams(window.location.search);
        const jozveId = urlParams.get('id');

        if (!jozveId) { 
            document.getElementById('content-area').innerHTML = '<p style="text-align:center; color:red;">خطا: جزوه‌ای انتخاب نشده است.</p>'; 
            return; 
        }

        try {
            // دریافت اطلاعات از جدول jozve_list
            const { data, error } = await supabaseClient.from('jozve_list').select('*').eq('id', jozveId).single();
            if (error) throw error;

            // شروع ساخت HTML
            let html = `<div class="chapter-box trad-box">${data.title}</div>`;
            
            // اگر نوع (type) وجود داشت، نمایش بده
            if(data.type) {
                html += `<div style="text-align: center; margin-bottom: 20px;"><span class="chapter-tag">${data.type}</span></div>`;
            }

            // بررسی تک تک فیلدها: اگر متنی توش نوشته شده بود، کادرش رو نشون بده
            if(data.text) html += `<div class="parchment-box trad-box">${data.text.replace(/\n/g, '<br>')}</div>`;
            if(data.definition) html += `<div class="definition-box trad-box">${data.definition.replace(/\n/g, '<br>')}</div>`;
            if(data.note) html += `<div class="tip-box trad-box"><strong>نکته:</strong> ${data.note.replace(/\n/g, '<br>')}</div>`;
            if(data.example) html += `<div class="example-box trad-box"><strong>مثال:</strong> ${data.example.replace(/\n/g, '<br>')}</div>`;
            if(data.formula) html += `<div class="formula-box trad-box" dir="ltr">${data.formula}</div>`;
            if(data.warning) html += `<div class="warning-box trad-box"><strong>هشدار:</strong> ${data.warning.replace(/\n/g, '<br>')}</div>`;
            if(data.result) html += `<div class="result-box trad-box"><strong>نتیجه:</strong> ${data.result.replace(/\n/g, '<br>')}</div>`;
            if(data.quote) html += `<div class="quote-box trad-box">${data.quote.replace(/\n/g, '<br>')}</div>`;
            if(data.question) html += `<div class="question-box trad-box">${data.question.replace(/\n/g, '<br>')}</div>`;
            if(data.answer) html += `<div class="answer-box trad-box">${data.answer.replace(/\n/g, '<br>')}</div>`;

            // دکمه دانلود فایل ضمیمه (اگر لینکی وارد شده بود)
            if(data.link) {
                html += `<div style="text-align: center; margin-top: 30px;">
                            <a href="${data.link}" target="_blank" style="background: var(--wine); color: #fff; padding: 15px 40px; border-radius: 12px; text-decoration: none; font-weight: bold; font-size: 16px; display: inline-block; border: 2px solid var(--gold); box-shadow: 0 5px 15px rgba(0,0,0,0.2); transition: 0.3s;">
                                <i class="fa-solid fa-download"></i> دانلود فایل PDF
                            </a>
                         </div>`;
            }

            // تزریق به صفحه
            document.getElementById('content-area').innerHTML = html;

        } catch (err) {
            console.error(err);
            document.getElementById('content-area').innerHTML = `<p style="color:red; text-align:center;">خطا در دریافت اطلاعات. لطفا VPN را بررسی کنید یا جزوه وجود ندارد.</p>`;
        }
    }
    
    document.addEventListener('DOMContentLoaded', loadJozve);
</script>
</body>
</html>
