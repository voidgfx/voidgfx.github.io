<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشاهده سوالات | آکادمی دانش</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { 
            --gold: #c49a50; --gold-light: #e8cf94; --navy: #172b4d; 
            --wine: #803b4a; --cream: #fff7e5; --brown: #76552f; 
            --bg-color: #f9f6f0;
        }
        
        body { font-family: 'Vazirmatn', sans-serif; background-color: var(--bg-color); padding: 20px; line-height: 2; color: #333; display: flex; flex-direction: column; min-height: 100vh; }
        .container { max-width: 850px; margin: 0 auto; width: 100%; flex: 1; }

        /* هدر سایت */
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid var(--gold); padding-bottom: 15px; }
        .logo-text { font-size: 20px; font-weight: 900; color: var(--navy); display: flex; align-items: center; gap: 8px; }
        .logo-text i { color: var(--gold); }
        .btn-back { text-decoration: none; background: var(--navy); color: #fff; padding: 8px 20px; border-radius: 50px; font-size: 14px; transition: 0.3s; display: flex; align-items: center; gap: 5px;}
        .btn-back:hover { background: var(--wine); }

        /* سرفصل اصلی (کادر آبی سنتی) */
        .chapter-box { 
            background: linear-gradient(135deg,#193653,#294e69); color: #fff3d3; 
            text-align: center; border: 3px double #d6b66d; border-radius: 12px; 
            padding: 30px 18px; box-shadow: 0 8px 25px #142d4530; margin-bottom: 40px; 
        }
        .chapter-box h1 { font-size: 28px; margin: 0; font-weight: 900; text-shadow: 1px 1px 2px #000; }
        .chapter-box::before, .chapter-box::after { content: "❧ ✦ ❧"; display: block; color: #e5c67d; font-size: 22px; margin: 10px 0;}

        /* استایل سوالات (شبیه همیار) */
        .question-item {
            margin-bottom: 35px;
            padding-bottom: 20px;
            border-bottom: 1px dashed #d5b66f;
        }
        
        .question-text {
            font-size: 18px;
            font-weight: 900;
            color: var(--navy);
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        
        .question-number {
            background: var(--navy);
            color: var(--gold-light);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
            margin-top: 5px;
        }

        .answer-text {
            font-size: 16px;
            color: #444;
            background: #e9f4e9; /* پس زمینه سبز ملایم برای جواب */
            padding: 15px 20px;
            border-radius: 10px;
            border-right: 5px solid #47734e;
            margin-right: 40px; /* فاصله از سمت راست */
            position: relative;
        }

        .answer-text::before {
            content: "پاسخ:";
            font-weight: 900;
            color: #47734e;
            margin-left: 8px;
        }

        /* موبایل */
        @media (max-width: 600px) { 
            .chapter-box h1 { font-size: 22px; } 
            .question-text { font-size: 16px; }
            .answer-text { margin-right: 0; font-size: 14px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-bar">
            <div class="logo-text"><i class="fa-solid fa-graduation-cap"></i> آکادمی دانش</div>
            <a href="index.html" class="btn-back"><i class="fa-solid fa-arrow-right"></i> بازگشت به لیست</a>
        </div>
        <div id="content-area">
            <p style="text-align:center;">در حال دریافت اطلاعات...</p>
        </div>
    </div>

<script>
    const supabaseUrl = 'https://quvmycjmphfufodygrfe.supabase.co'; 
    const supabaseKey = 'sb_publishable_yJMUW7s7PGzq1bILJwFbKw_HM0FE57D'; 
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    async function loadJozve() {
        const urlParams = new URLSearchParams(window.location.search);
        const jozveId = urlParams.get('id');
        if (!jozveId) { document.getElementById('content-area').innerHTML = '<p style="text-align:center; color:red;">خطا!</p>'; return; }

        try {
            const { data, error } = await supabaseClient.from('jozve_list').select('*').eq('id', jozveId).single();
            if (error) throw error;

            let html = `<div class="chapter-box"><h1>${data.title}</h1></div>`;

            // گرفتن سوال و جواب‌ها از فیلدهای دیتابیس
            // فرض میکنیم متن سوال و جواب با خط جدید (Enter) از هم جدا شدن
            const questions = (data.text || '').split('\n').filter(q => q.trim() !== '');
            const answers = (data.answer || '').split('\n').filter(a => a.trim() !== '');

            if (questions.length > 0) {
                questions.forEach((q, index) => {
                    const a = answers[index] || 'پاسخی ثبت نشده است.'; // اگر جواب نبود
                    html += `
                        <div class="question-item">
                            <div class="question-text">
                                <span class="question-number">${index + 1}</span>
                                <span>${q}</span>
                            </div>
                            <div class="answer-text">
                                ${a}
                            </div>
                        </div>
                    `;
                });
            } else {
                html += `<p style="text-align:center; color:#666;">متنی برای نمایش وجود ندارد.</p>`;
            }

            document.getElementById('content-area').innerHTML = html;

        } catch (err) {
            console.error(err);
            document.getElementById('content-area').innerHTML = `<p style="color:red; text-align:center;">خطا در دریافت اطلاعات.</p>`;
        }
    }
    document.addEventListener('DOMContentLoaded', loadJozve);
</script>
</body>
</html>
