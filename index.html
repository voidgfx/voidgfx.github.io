<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOID GFX — گالری طراحی</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- هدر -->
    <header class="navbar">
        <div class="nav-inner">
            <a href="index.html" class="brand">
                <span class="brand-symbol">V</span>
                <span>VOID<span class="purple">GFX</span></span>
            </a>
            <nav class="nav-links">
                <a href="index.html">گالری</a>
                <a href="upload.html">آپلود</a>
                <a href="profile.html">پروفایل</a>
            </nav>
            <div class="nav-actions">
                <a href="auth.html" class="btn btn-primary" id="authBtn">ورود / ثبت‌نام</a>
            </div>
        </div>
    </header>

    <!-- هیرو -->
    <section class="hero" style="padding: 80px 30px; text-align: center;">
        <h1 style="font-size: 3rem; font-weight: 900; margin-bottom: 20px;">
            اثرت رو بساز.<br>
            <span style="background: linear-gradient(135deg, var(--void-light), var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">دنیات رو به اشتراک بذار.</span>
        </h1>
        <p style="color: var(--text-dim); font-size: 1.1rem; max-width: 600px; margin: 0 auto 30px;">
            ریگ، مدل، تامنیل و محتوای باکیفیت ساخته‌شده توسط سازندگان رو کشف، دانلود و به اشتراک بذار.
        </p>
        <div style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;">
            <a href="#gallery" class="btn btn-primary btn-large">مشاهده فایل‌ها</a>
            <a href="upload.html" class="btn btn-ghost btn-large">آپلود اثرت</a>
        </div>
    </section>

    <!-- گالری -->
    <section class="section" id="gallery" style="padding: 40px 30px; max-width: 1200px; margin: 0 auto;">
        <h2 style="margin-bottom: 30px; font-size: 2rem;">محتوای جدید</h2>
        <div class="gfx-grid" id="gfx-grid">
            <div style="text-align: center; color: var(--text-dim); grid-column: 1/-1; padding: 40px;">در حال بارگذاری...</div>
        </div>
    </section>

    <footer>
        <div class="footer-inner">
            <div class="brand">
                <span class="brand-symbol">V</span>
                <span>VOID<span class="purple">GFX</span></span>
            </div>
            <p>© ۲۰۲۶ VOID GFX</p>
        </div>
    </footer>

    <script type="module">
        import { supabase } from './config.js';

        async function loadAssets() {
            const grid = document.getElementById('gfx-grid');
            if (!grid) return;

            const { data, error } = await supabase
                .from('assets')
                .select('*')
                .order('created_at', { ascending: false });

            if (error || !data || data.length === 0) {
                grid.innerHTML = '<p style="color: #888; text-align: center; grid-column: 1/-1;">هنوز فایلی آپلود نشده است.</p>';
                return;
            }

            grid.innerHTML = data.map(item => `
                <div class="gfx-card" onclick="window.location.href='asset.html?id=${item.id}'">
                    <div class="gfx-preview">
                        <img src="${item.preview_url || 'https://via.placeholder.com/400x300/1a1a2e/8b5cf6?text=No+Preview'}" alt="${item.title}">
                    </div>
                    <div class="gfx-info">
                        <span class="gfx-category">${item.category || 'عمومی'}</span>
                        <h3 class="gfx-title">${item.title || 'بدون عنوان'}</h3>
                        <div class="gfx-meta">
                            <span>♥ ${item.likes || 0}</span>
                            <span>↓ ${item.downloads || 0}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        loadAssets();
    </script>
</body>
                </html>
