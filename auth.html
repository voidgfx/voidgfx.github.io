<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود / ثبت‌نام — VOID GFX</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="nav-inner">
            <a href="index.html" class="brand">
                <span class="brand-symbol">V</span>
                <span>VOID<span class="purple">GFX</span></span>
            </a>
        </div>
    </header>

    <div class="form-container">
        <h1 id="authTitle">ورود به حساب</h1>

        <form id="loginForm">
            <div class="form-group">
                <label>ایمیل</label>
                <input type="email" id="loginEmail" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label>رمز عبور</label>
                <input type="password" id="loginPassword" placeholder="رمز عبورت" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">ورود</button>
            <p style="text-align: center; margin-top: 15px; color: var(--text-dim);">
                حساب نداری؟ <a href="#" id="switchToRegister" style="color: var(--void-light);">ثبت‌نام کن</a>
            </p>
        </form>

        <form id="registerForm" style="display: none;">
            <div class="form-group">
                <label>نام کاربری</label>
                <input type="text" id="registerUsername" placeholder="مثلاً taha" minlength="3" required>
            </div>
            <div class="form-group">
                <label>ایمیل</label>
                <input type="email" id="registerEmail" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label>رمز عبور</label>
                <input type="password" id="registerPassword" placeholder="حداقل ۶ کاراکتر" minlength="6" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">ساخت حساب</button>
            <p style="text-align: center; margin-top: 15px; color: var(--text-dim);">
                حساب داری؟ <a href="#" id="switchToLogin" style="color: var(--void-light);">وارد شو</a>
            </p>
        </form>

        <p id="authMessage" style="text-align: center; margin-top: 15px;"></p>
    </div>

    <script type="module">
        import { supabase } from './config.js';

        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const authTitle = document.getElementById('authTitle');
        const authMessage = document.getElementById('authMessage');

        document.getElementById('switchToRegister').addEventListener('click', (e) => {
            e.preventDefault();
            loginForm.style.display = 'none';
            registerForm.style.display = 'block';
            authTitle.textContent = 'ساخت حساب جدید';
        });

        document.getElementById('switchToLogin').addEventListener('click', (e) => {
            e.preventDefault();
            registerForm.style.display = 'none';
            loginForm.style.display = 'block';
            authTitle.textContent = 'ورود به حساب';
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) {
                authMessage.textContent = '❌ ' + error.message;
                authMessage.style.color = 'var(--danger)';
            } else {
                window.location.href = 'profile.html';
            }
        });

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('registerUsername').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;

            const { error } = await supabase.auth.signUp({
                email,
                password,
                options: { data: { username } }
            });

            if (error) {
                authMessage.textContent = '❌ ' + error.message;
                authMessage.style.color = 'var(--danger)';
            } else {
                authMessage.textContent = '✅ حساب ساخته شد! حالا وارد شو.';
                authMessage.style.color = 'var(--void-light)';
                setTimeout(() => window.location.href = 'auth.html', 1500);
            }
        });
    </script>
</body>
</html>
