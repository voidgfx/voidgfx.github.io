<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>پنل مدیریت | VOID GFX</title>
<link href="https://fonts.cdnfonts.com/css/minecraft-4" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Mikhak';
    src: url('github.com/voidgfx/1/Mikhak-Medium.ttf') format('truetype');
    font-display: swap;
  }

  :root {
    --void: #8b5cf6;
    --void-light: #a78bfa;
    --void-dark: #6d28d9;
    --gold: #fbbf24;
    --bg: #08080f;
    --surface: #12121e;
    --surface-2: #1a1a2c;
    --border: #2a2a42;
    --text: #ececf5;
    --muted: #8b8ba8;
    --green: #4ade80;
    --red: #f87171;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Mikhak', Tahoma, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px;
    line-height: 1.75;
  }

  .container { max-width: 1000px; margin: 0 auto; }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 32px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }

  .brand { font-family: 'Minecraft', 'Mikhak', sans-serif; font-size: 1.5rem; letter-spacing: 1.5px; }
  .brand .void { color: var(--void-light); }
  .brand .gfx { color: var(--gold); }

  .btn {
    padding: 10px 20px; border-radius: 10px; border: none;
    font-family: inherit; font-size: 0.9rem; cursor: pointer;
    transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px;
  }
  .btn-primary { background: var(--void); color: #fff; }
  .btn-primary:hover { background: var(--void-dark); transform: translateY(-2px); }
  .btn-danger { background: rgba(248,113,113,0.15); color: var(--red); border: 1px solid rgba(248,113,113,0.3); }
  .btn-danger:hover { background: rgba(248,113,113,0.25); }
  .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .btn-ghost:hover { border-color: var(--void); color: var(--void-light); }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; margin-bottom: 24px; }
  .card h2 { font-size: 1.2rem; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .form-group { margin-bottom: 16px; }
  .form-label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
  .form-input, .form-textarea {
    width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text); font-family: inherit; outline: none; transition: border 0.2s;
  }
  .form-input:focus, .form-textarea:focus { border-color: var(--void); }
  .form-textarea { resize: vertical; min-height: 80px; }

  .upload-area {
    border: 2px dashed var(--border); border-radius: 12px; padding: 20px;
    text-align: center; cursor: pointer; transition: all 0.2s; position: relative;
  }
  .upload-area:hover { border-color: var(--void); background: rgba(139,92,246,0.05); }
  .upload-area img { width: 100%; max-height: 250px; object-fit: contain; border-radius: 8px; display: none; }
  .upload-area.has-image img { display: block; }
  .upload-area.has-image .placeholder { display: none; }

  .table { width: 100%; border-collapse: collapse; margin-top: 16px; background: var(--surface); border-radius: 12px; overflow: hidden; }
  .table th, .table td { padding: 12px 16px; text-align: right; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
  .table th { background: var(--surface-2); color: var(--muted); font-weight: 500; }
  .table tr:hover td { background: rgba(139,92,246,0.05); }
  .table img { width: 40px; height: 40px; object-fit: cover; border-radius: 6px; }

  .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 0.75rem; background: rgba(251,191,36,0.1); color: var(--gold); border: 1px solid rgba(251,191,36,0.2); }
  .login-box { max-width: 400px; margin: 100px auto; text-align: center; }
  .hidden { display: none !important; }

  @media (max-width: 600px) {
    .form-row { grid-template-columns: 1fr; }
    .table th, .table td { padding: 8px; font-size: 0.8rem; }
    .table img { width: 30px; height: 30px; }
  }
</style>
</head>
<body>

<!-- صفحه لاگین -->
<div class="login-box" id="loginBox">
  <div class="card">
    <h2 style="justify-content: center;">🔐 ورود به پنل مدیریت</h2>
    <div class="form-group">
      <input type="email" class="form-input" id="loginEmail" placeholder="ایمیل ادمین" style="text-align:center; margin-bottom:12px">
      <input type="password" class="form-input" id="loginPassword" placeholder="رمز عبور ادمین" style="text-align:center; margin-bottom:16px">
      <button class="btn btn-primary" style="width:100%; justify-content:center;" onclick="handleLogin()">ورود به پنل</button>
    </div>
  </div>
</div>

<!-- پنل اصلی -->
<div class="container hidden" id="adminPanel">
  <div class="header">
    <div class="brand"><span class="void">VOID</span> <span class="gfx">GFX</span> — پنل مدیریت</div>
    <button class="btn btn-ghost" onclick="logout()">✕ خروج</button>
  </div>

  <div class="card">
    <h2>➕ افزودن کار جدید</h2>
    <form onsubmit="addArtwork(event)">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">عنوان کار</label>
          <input type="text" class="form-input" id="artTitle" required placeholder="مثلاً لوگوی PvP">
        </div>
        <div class="form-group">
          <label class="form-label">دسته‌بندی</label>
          <input type="text" class="form-input" id="artCategory" required placeholder="لوگو / بنر / تامبنیل">
        </div>
      </div>
      
      <div class="form-group">
        <label class="form-label">عکس (حداکثر ۲ مگابایت)</label>
        <div class="upload-area" id="uploadArea" onclick="document.getElementById('artImage').click()">
          <div class="placeholder">
            <div style="font-size:2rem; margin-bottom:8px;">📷</div>
            <div>برای آپلود عکس کلیک کن</div>
          </div>
          <img id="previewImg" alt="">
        </div>
        <input type="file" id="artImage" accept="image/*" style="display:none" onchange="handleImage(this)">
      </div>

      <div class="form-group">
        <label class="form-label">توضیحات</label>
        <textarea class="form-textarea" id="artDesc" placeholder="توضیح کوتاه..."></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">آیکون (در صورت نداشتن عکس)</label>
          <input type="text" class="form-input" id="artIcon" value="🎨">
        </div>
        <div class="form-group">
          <label class="form-label">برچسب‌ها (با کاما جدا کن)</label>
          <input type="text" class="form-input" id="artTags" placeholder="PvP, ماینکرفت">
        </div>
      </div>

      <button type="submit" class="btn btn-primary">ذخیره در دیتابیس</button>
    </form>
  </div>

  <div class="card">
    <h2>📋 لیست کارها</h2>
    <table class="table">
      <thead>
        <tr>
          <th>پیش‌نمایش</th>
          <th>عنوان</th>
          <th>دسته</th>
          <th>❤️ لایک</th>
          <th>عملیات</th>
        </tr>
      </thead>
      <tbody id="artList"></tbody>
    </table>
  </div>
</div>

<script>
/* ============================================================
   ⚠️ تنظیمات خودت رو اینجا بذار:
   ============================================================ */
const SUPABASE_URL = "https://bqclfxdhxvswgmvdvtok.supabase.co"
const SUPABASE_KEY = "sb_publishable_9F1P1APFa7IbtiR-5UYTQA_sJQnGul8";
const ADMIN_EMAIL = 'tahadaneshbayan2@gmail.com'; 
const ADMIN_PASSWORD = "a123b456"

let currentImage = null;

/* ============================================================
   لاگین ادمین
   ============================================================ */
function handleLogin() {
  const email = document.getElementById('loginEmail').value.trim().toLowerCase();
  const pass = document.getElementById('loginPassword').value;

  if (email === ADMIN_EMAIL.toLowerCase() && pass === ADMIN_PASSWORD) {
    document.getElementById('loginBox').classList.add('hidden');
    document.getElementById('adminPanel').classList.remove('hidden');
    loadArtworks();
  } else {
    alert('ایمیل یا رمز عبور اشتباه است!');
  }
}

function logout() {
  document.getElementById('loginBox').classList.remove('hidden');
  document.getElementById('adminPanel').classList.add('hidden');
  document.getElementById('loginPassword').value = '';
}

/* ============================================================
   آپلود و فشرده‌سازی عکس
   ============================================================ */
function handleImage(input) {
  const file = input.files[0];
  if (!file) return;

  if (file.size > 2 * 1024 * 1024) {
    alert('حجم عکس باید کمتر از ۲ مگابایت باشد');
    return;
  }

  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      let { width, height } = img;
      if (width > 800) { height = (height * 800) / width; width = 800; }
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      
      currentImage = canvas.toDataURL('image/jpeg', 0.8);
      
      const preview = document.getElementById('previewImg');
      preview.src = currentImage;
      document.getElementById('uploadArea').classList.add('has-image');
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* ============================================================
   ارتباط با Supabase
   ============================================================ */
async function loadArtworks() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/assets?select=*&order=created_at.desc`, {
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
      }
    });
    const data = await res.json();
    
    // گرفتن تعداد لایک‌ها
    const likesRes = await fetch(`${SUPABASE_URL}/rest/v1/likes?select=asset_id`, {
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
      }
    });
    const likes = await likesRes.json();

    renderTable(data, likes);
  } catch (err) {
    console.error(err);
    alert('خطا در لود اطلاعات از دیتابیس');
  }
}

function renderTable(artworks, likes) {
  const tbody = document.getElementById('artList');
  if (artworks.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--muted);">کاری وجود ندارد</td></tr>';
    return;
  }

  tbody.innerHTML = artworks.map(art => {
    const likeCount = likes.filter(l => l.asset_id === art.id).length;
    const imgHtml = art.image_url 
      ? `<img src="${art.image_url}" alt="img">` 
      : `<span style="font-size:1.4rem;">${art.icon || '🎨'}</span>`;
      
    return `
      <tr>
        <td>${imgHtml}</td>
        <td>${art.title}</td>
        <td><span class="badge">${art.category}</span></td>
        <td>❤️ ${likeCount}</td>
        <td><button class="btn btn-danger" style="padding:4px 12px;font-size:0.8rem;" onclick="deleteArtwork('${art.id}')">حذف</button></td>
      </tr>
    `;
  }).join('');
}

async function addArtwork(e) {
  e.preventDefault();
  const title = document.getElementById('artTitle').value;
  const category = document.getElementById('artCategory').value;
  const desc = document.getElementById('artDesc').value;
  const icon = document.getElementById('artIcon').value;
  const tagsRaw = document.getElementById('artTags').value;
  const tags = tagsRaw ? tagsRaw.split(',').map(t => t.trim()) : [];

  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/assets`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify({
        title,
        category,
        "desc": desc,
        description: desc,
        icon,
        tags,
        image_url: currentImage,
        file_url: currentImage,
        preview_url: currentImage,
        downloads: 0,
        views: 0,
        likes: 0
      })
    });

    if (!res.ok) {
       const errText = await res.text();
       throw new Error(errText);
    }

    // ریست فرم
    e.target.reset();
    document.getElementById('uploadArea').classList.remove('has-image');
    currentImage = null;
    
    // رفرش لیست
    loadArtworks();
    alert('✅ کار جدید با موفقیت ذخیره شد!');
  } catch (err) {
    console.error(err);
    alert('خطا در ذخیره به دیتابیس: ' + err.message);
  }
}

async function deleteArtwork(id) {
  if (!confirm('مطمئنی می‌خوای این کار رو حذف کنی؟')) return;
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/assets?id=eq.${id}`, {
      method: 'DELETE',
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
      }
    });
    loadArtworks();
  } catch (err) {
    alert('خطا در حذف');
  }
}
</script>
</body>
</html>
